<!DOCTYPE html>
<html lang="en" style="font:12px/1.5 'Inter',sans-serif;font-weight:400;color:#e0e0e0;">
<head><meta charset="utf-8"><title>OTP Helper</title>
<link rel="stylesheet" href="https://unpkg.com/primer.css@latest/primer.css">
<style>
body{margin:0;padding:8px;background:#222;color:#e0e0e0;width:280px;height:420px;overflow:hidden;}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
#refresh{cursor:pointer;}
.mail-card{background:#333;border-radius:6px;padding:8px;margin:4px 0;cursor:pointer;}
.card-actions{display:flex;gap:4px;margin-top:6px;}
button{background:#555;color:#fff;border:none;border-radius:3px;padding:3px 6px;cursor:pointer;font-size:12px;}
</style>
</head>
<body>
  <header>
    <h2 style="font-size:14px;margin:0;">OTP Helper</h2>
    <span id="refresh" title="Refresh">&#x21bb;</span>
  </header>
  <div id="status" style="color:#999;font-size:12px">Loading…</div>
  <div id="list"></div>
<script src="popup.js"></script>
</body>
</html>
